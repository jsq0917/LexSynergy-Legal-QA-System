[project]
name = "lexsynergy"
version = "0.1.0"
description = "法律合规多智能体专家问答系统"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[http-server]==0.3.22",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: 需要真实服务/网络的用例（默认不跑）",
]

[tool.uv]
package = false
